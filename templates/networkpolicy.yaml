{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "http-echo.fullname" . }}
  labels:
    {{- include "http-echo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "http-echo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # The ingress controller
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
        # In-namespace clients that opt in (e.g. the helm test pod)
        - podSelector:
            matchLabels:
              {{ include "http-echo.fullname" . }}-client: "true"
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  # echo-server only answers requests and never opens connections itself, so all egress is denied
  egress: {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
  {{- else }} []
  {{- end }}
{{- end }}
